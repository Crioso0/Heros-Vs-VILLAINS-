name: Deploy to GitHub Pages

# Publishes the built game so it can be opened on a phone and installed from
# Safari via Share -> Add to Home Screen.
#
# ONE-TIME SETUP, which cannot be automated from here:
#   Settings -> Pages -> Source -> "GitHub Actions"
# Do that before the first run, or the deploy step fails with
# "Get Pages site failed". See docs/NATIVE.md.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same checks that guard local development: a typecheck plus the
      # headless simulation and layout assertions.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
